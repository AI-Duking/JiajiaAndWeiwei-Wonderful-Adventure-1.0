<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b22">
<title>嘉嘉与玮玮的奇妙冒险</title>
<style>
  /* ================= 全局 ================= */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0d0b22;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    touch-action:none;
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
  }
  #game { position:fixed; inset:0; display:block; touch-action:none; }
  .hidden { display:none !important; }

  /* ================= 主页 / 角色选择页 / 关卡选择页 ================= */
  #homeScreen {
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1100px 760px at 50% 34%, rgba(78,64,146,0.30), rgba(13,11,34,0.74));
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }
  #homeScreen h1 {
    font-size:clamp(26px, 5vw, 46px); letter-spacing:4px;
    background:linear-gradient(120deg,#F6BED3,#B9C6F2);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:12px;
    animation:titleGlow 4s ease-in-out infinite;
  }
  .homeBtns { display:flex; gap:20px; justify-content:center; margin-top:30px; flex-wrap:wrap; }
  .homeBtn { margin-top:0; min-width:170px; padding:14px 40px; font-size:17px; }
  .levelCard {
    width:min(220px, 40vw); min-width:140px;
    background:linear-gradient(165deg, rgba(42,36,82,0.92), rgba(24,20,50,0.94));
    border:2px solid rgba(255,190,216,0.35);
    border-radius:20px; padding:26px 14px; cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    box-shadow:0 8px 26px rgba(0,0,0,0.35);
  }
  .levelCard:hover, .levelCard:active {
    transform:translateY(-8px) scale(1.03);
    border-color:rgba(255,190,216,0.9);
    box-shadow:0 18px 44px rgba(255,160,200,0.22), 0 0 32px rgba(160,160,240,0.14);
  }
  .levelCard.locked { opacity:0.5; }
  .levelCard .lname { font-size:20px; color:#F6D8E6; letter-spacing:3px; }
  .levelCard .lstate { margin-top:8px; font-size:13px; color:#F2A7C3; letter-spacing:2px; }
  .levelCard.locked .lstate { color:rgba(200,190,220,0.6); }
  .btnGhostSmall {
    margin-top:30px; padding:9px 26px; border-radius:999px; cursor:pointer;
    background:rgba(40,34,80,0.85); color:#CFC7E8;
    border:1.5px solid rgba(255,190,216,0.45);
    font-size:13px; letter-spacing:3px; font-family:inherit;
    transition:all .18s ease;
  }
  .btnGhostSmall:hover { background:rgba(66,56,120,0.95); border-color:rgba(255,190,216,0.8); }
  #selectScreen, #levelSelectScreen {
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1100px 760px at 50% 34%, rgba(78,64,146,0.30), rgba(13,11,34,0.74));
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }
  .selectInner { text-align:center; padding:24px 18px; max-width:900px; width:100%; }
  #selectScreen h1, #levelSelectScreen h1 {
    font-size:clamp(22px, 4.2vw, 40px); letter-spacing:3px;
    background:linear-gradient(120deg,#F6BED3,#B9C6F2);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:12px;
    animation:titleGlow 4s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%,100% { filter:drop-shadow(0 0 6px rgba(246,190,211,0.25)); }
    50%     { filter:drop-shadow(0 0 18px rgba(185,198,242,0.55)); }
  }
  .sub { color:rgba(214,205,240,0.66); font-size:clamp(12px,1.8vw,15px); letter-spacing:4px; margin-bottom:36px; }
  .cards { display:flex; gap:clamp(16px,4vw,34px); justify-content:center; flex-wrap:wrap; }
  .card {
    width:min(240px, 42vw); min-width:150px;
    background:linear-gradient(165deg, rgba(42,36,82,0.92), rgba(24,20,50,0.94));
    border:2px solid rgba(255,190,216,0.35);
    border-radius:24px; padding:20px 14px 18px; cursor:pointer;
    transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease;
    box-shadow:0 8px 26px rgba(0,0,0,0.35);
  }
  .card:hover, .card:active {
    transform:translateY(-10px) scale(1.03);
    border-color:rgba(255,190,216,0.9);
    box-shadow:0 18px 44px rgba(255,160,200,0.22), 0 0 32px rgba(160,160,240,0.14);
  }
  .card .name { font-size:24px; color:#F6D8E6; letter-spacing:6px; margin-top:4px; }
  .card .tag  { font-size:clamp(11px,1.6vw,13px); color:rgba(226,214,240,0.72); margin-top:6px; letter-spacing:1px; }
  .card canvas { width:150px; height:170px; display:block; margin:0 auto; }
  @media (max-width:560px) { .card canvas { width:112px; height:128px; } }
  .hint { margin-top:38px; color:rgba(205,195,232,0.45); font-size:12px; letter-spacing:1.5px; line-height:2; }

  /* ================= 弹窗 ================= */
  .modalWrap {
    position:fixed; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    background:rgba(12,10,28,0.8);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  }
  .modal {
    background:linear-gradient(160deg, rgba(32,26,62,0.97), rgba(22,16,44,0.97));
    border:2px solid rgba(255,190,216,0.55);
    border-radius:22px; padding:34px 40px;
    max-width:min(430px, 88vw); text-align:center;
    box-shadow:0 0 60px rgba(255,170,205,0.15), 0 20px 50px rgba(0,0,0,0.45);
    animation:pop .35s ease;
  }
  @keyframes pop { from { transform:scale(.92); opacity:0; } to { transform:scale(1); opacity:1; } }
  .modal h2 {
    color:#F4C7D8; font-size:clamp(19px,3vw,24px); letter-spacing:3px;
    margin-bottom:16px; text-shadow:0 0 14px rgba(246,190,211,0.4);
  }
  .modal p { color:#CFC7E8; font-size:clamp(14px,2vw,16px); line-height:2; letter-spacing:1px; }
  .modal .poem { margin:6px 0 22px; }
  .modal .poem b { color:#F6BED3; font-weight:normal; letter-spacing:1px; }
  .btn {
    margin-top:20px; padding:12px 36px; border:none; border-radius:999px; cursor:pointer;
    background:linear-gradient(135deg,#F2A7C3,#9FA8E8);
    color:#241A3E; font-size:16px; letter-spacing:4px; font-family:inherit;
    box-shadow:0 6px 20px rgba(242,167,195,0.25);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn:hover { transform:translateY(-2px) scale(1.04); filter:brightness(1.06); box-shadow:0 10px 26px rgba(242,167,195,0.38); }
  .btn:active { transform:scale(0.96); }

  /* ================= HUD ================= */
  #hud {
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px; pointer-events:none;
  }
  .hudCard {
    background:rgba(22,17,44,0.62); border:1.5px solid rgba(255,190,216,0.4);
    border-radius:14px; padding:8px 16px; color:#F6E3EC;
    font-size:15px; letter-spacing:2px;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .hudLeft { display:flex; align-items:center; gap:10px; }
  .hudHearts { display:flex; gap:5px; padding:8px 14px; }
  .heart {
    font-size:17px; line-height:1; color:#F06D86;
    text-shadow:0 0 8px rgba(240,109,134,0.75);
    transition:color .25s ease, text-shadow .25s ease;
  }
  .heart.lost { color:rgba(120,110,150,0.45); text-shadow:none; }
  .hudLevelSel { position:relative; cursor:pointer; pointer-events:auto; transition:background .2s ease; }
  .hudLevelSel:hover { background:rgba(64,54,116,0.75); }
  #levelPanel {
    position:absolute; top:calc(100% + 8px); right:0;
    min-width:216px; padding:8px; border-radius:16px;
    background:rgba(22,17,44,0.94); border:1.5px solid rgba(255,190,216,0.45);
    box-shadow:0 12px 34px rgba(0,0,0,0.45);
    display:flex; flex-direction:column; gap:6px;
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    pointer-events:auto;
  }
  .lvlBtn {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:9px 14px; border-radius:12px; border:1.5px solid transparent;
    background:rgba(40,34,80,0.8); color:#E8DFF2; font-size:14px; letter-spacing:1px;
    cursor:pointer; font-family:inherit; transition:all .18s ease;
  }
  .lvlBtn:hover { background:rgba(66,56,120,0.9); border-color:rgba(255,190,216,0.5); }
  .lvlBtn.current { border-color:rgba(242,167,195,0.85); box-shadow:0 0 12px rgba(242,167,195,0.25); }
  .lvlBtn.locked { opacity:0.45; cursor:not-allowed; }
  .lvlBtn .lvlState { font-size:12px; color:#F2A7C3; }
  .lvlBtn.locked .lvlState { color:rgba(200,190,220,0.6); }
  #pwdInput {
    width:100%; margin-top:14px; padding:10px 14px;
    background:rgba(40,34,80,0.85); border:1.5px solid rgba(255,190,216,0.5);
    border-radius:12px; color:#F6E3EC; font-size:16px; letter-spacing:4px;
    font-family:inherit; outline:none; text-align:center;
  }
  #pwdInput:focus { border-color:rgba(242,167,195,0.9); box-shadow:0 0 10px rgba(242,167,195,0.3); }
  .pwdErr { margin-top:8px; color:#F08A9A; font-size:13px; letter-spacing:1px; }
  .pwdBtns { display:flex; gap:14px; justify-content:center; margin-top:18px; }
  .pwdBtns .btn { margin-top:0; }
  .btnGhost {
    background:rgba(40,34,80,0.9); color:#CFC7E8;
    border:1.5px solid rgba(255,190,216,0.45); box-shadow:none;
  }
  .pwdShake { animation:shake .4s ease; }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    20%,60% { transform:translateX(-7px); }
    40%,80% { transform:translateX(7px); }
  }

  /* ================= 虚拟按键 ================= */
  #touchUI {
    position:fixed; left:0; right:0; bottom:0; z-index:30; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:0 18px calc(16px + env(safe-area-inset-bottom));
  }
  .moveWrap { display:flex; gap:14px; }
  .tbtn {
    pointer-events:auto; width:68px; height:68px; border-radius:50%;
    background:rgba(30,24,60,0.55); border:2px solid rgba(255,190,216,0.45);
    display:flex; align-items:center; justify-content:center;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    transition:transform .1s ease, background .1s ease;
    touch-action:none;
  }
  .tbtn:active { transform:scale(0.92); background:rgba(255,190,216,0.28); }
  .triL { width:0; height:0; border-top:15px solid transparent; border-bottom:15px solid transparent; border-right:22px solid rgba(246,216,230,0.92); margin-left:-4px; }
  .triR { width:0; height:0; border-top:15px solid transparent; border-bottom:15px solid transparent; border-left:22px solid rgba(246,216,230,0.92); margin-left:4px; }
  .triU { width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent; border-bottom:24px solid rgba(246,216,230,0.92); }
  #btnJump { width:84px; height:84px; flex-direction:column; gap:2px; }
  #btnJump span { font-size:11px; color:rgba(246,216,230,0.85); letter-spacing:2px; }
  .rightWrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .rightBottom { display:flex; gap:14px; align-items:flex-end; }
  #btnAttack { width:64px; height:64px; font-size:18px; color:#F6D8E6; letter-spacing:0; }
  #btnUltimate { width:54px; height:54px; font-size:15px; color:#F6D8E6; letter-spacing:0; border-color:rgba(185,169,240,0.6); }
  #btnUltimate.ready { animation:energyPulse .8s ease-in-out infinite; }

  /* ================= 大招能量条 ================= */
  #energyWrap {
    position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:25; width:min(320px, 46vw);
    text-align:center; pointer-events:none;
  }
  #energyBar {
    height:12px; border-radius:999px; overflow:hidden;
    background:rgba(22,17,44,0.65); border:1.5px solid rgba(255,190,216,0.4);
  }
  #energyFill { height:100%; width:0%; border-radius:999px; }
  #energyLabel { margin-top:6px; font-size:11px; color:rgba(230,218,245,0.75); letter-spacing:2px; }
  #energyWrap.ready #energyFill { animation:energyPulse .8s ease-in-out infinite; }
  @keyframes energyPulse {
    0%,100% { filter:brightness(1); box-shadow:0 0 6px rgba(160,160,255,0.45); }
    50%     { filter:brightness(1.55); box-shadow:0 0 18px rgba(255,180,220,0.85); }
  }
  @media (pointer: coarse) {
    #energyWrap { bottom:calc(120px + env(safe-area-inset-bottom)); }
  }
  #bossBar {
    position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:22;
    display:flex; align-items:center; gap:10px; padding:8px 16px;
    background:rgba(22,17,44,0.62); border:1.5px solid rgba(255,170,140,0.5);
    border-radius:14px; pointer-events:none;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .bossLabel { color:#F2B89B; font-size:13px; letter-spacing:3px; }
  .bossSegs { display:flex; gap:5px; }
  .bossSegs span {
    width:22px; height:10px; border-radius:4px;
    background:linear-gradient(180deg,#F28A5E,#C94F3A);
    box-shadow:0 0 6px rgba(240,120,80,0.6);
    transition:background .2s ease, box-shadow .2s ease;
  }
  .bossSegs span.off { background:rgba(120,110,150,0.45); box-shadow:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 主页 -->
<div id="homeScreen">
  <div class="selectInner">
    <h1>嘉嘉与玮玮的奇妙冒险</h1>
    <p class="sub">穿过星空与山谷，奔赴一场相遇</p>
    <div class="homeBtns">
      <button class="btn homeBtn" id="startGameBtn">开始游戏</button>
      <button class="btn btnGhost homeBtn" id="homeLevelBtn">选择关卡</button>
    </div>
  </div>
</div>

<!-- 关卡选择页 -->
<div id="levelSelectScreen" class="hidden">
  <div class="selectInner">
    <h1>选择关卡</h1>
    <p class="sub">选择已解锁的关卡开始冒险（未解锁可点击输入密码）</p>
    <div class="cards" id="levelCards"></div>
    <button class="btnGhostSmall" id="levelBackBtn">返回主页</button>
  </div>
</div>

<!-- 角色选择页 -->
<div id="selectScreen" class="hidden">
  <div class="selectInner">
    <h1>选择你的角色，奔赴这场相遇</h1>
    <p class="sub">一颗星星的旅程，从此刻开始</p>
    <div class="cards">
      <div class="card" id="cardBoy">
        <canvas id="previewBoy" width="300" height="340"></canvas>
        <div class="name">嘉嘉</div>
        <div class="tag">【勇敢出发的小男孩】</div>
      </div>
      <div class="card" id="cardGirl">
        <canvas id="previewGirl" width="300" height="340"></canvas>
        <div class="name">玮玮</div>
        <div class="tag">【温柔可爱的小女孩】</div>
      </div>
    </div>
    <p class="hint">电脑：A/D 或 ←/→ 移动，空格跳跃，左键攻击，G 释放大招　·　手机：屏幕底部虚拟按键</p>
    <button class="btnGhostSmall" id="selectBackBtn">返回主页</button>
  </div>
</div>

<!-- 关卡提示弹窗 -->
<div id="introModal" class="modalWrap hidden">
  <div class="modal">
    <h2 id="introTitle"></h2>
    <p id="introText"></p>
    <button class="btn" id="introBtn">继续前进</button>
  </div>
</div>

<!-- 结局弹窗（未完待续，后续关卡在此接续） -->
<div id="endingModal" class="modalWrap hidden">
  <div class="modal">
    <h2>未完待续</h2>
    <div class="poem">
      <p>巨龙已被击败，但旅程还未结束——</p>
      <p>新的篇章，正在酝酿…</p>
      <p><b>嘉嘉 &amp; 玮玮，下一场冒险见✨</b></p>
    </div>
    <button class="btn" id="restartBtn">重新开始</button>
  </div>
</div>

<!-- 密码解锁弹窗 -->
<div id="pwdModal" class="modalWrap hidden">
  <div class="modal">
    <h2>输入解锁密码</h2>
    <p>该关卡尚未解锁</p>
    <input type="password" id="pwdInput" inputmode="numeric" maxlength="8" placeholder="请输入密码">
    <div class="pwdErr hidden" id="pwdErr">密码错误</div>
    <div class="pwdBtns">
      <button class="btn btnGhost" id="pwdCancel">取消</button>
      <button class="btn" id="pwdOk">解锁</button>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hudLeft">
    <div class="hudCard hudHearts" id="hudHearts">
      <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
    </div>
    <div class="hudCard">星光：<span id="starCount">0</span></div>
  </div>
  <div class="hudCard hudLevelSel" id="levelSelBtn">第<span id="levelNo">一</span>关 · <span id="levelName"></span> ▾
    <div id="levelPanel" class="hidden"></div>
  </div>
</div>

<!-- 大招能量条 -->
<div id="energyWrap" class="hidden">
  <div id="energyBar"><div id="energyFill"></div></div>
  <div id="energyLabel">大招蓄能中 · G</div>
</div>

<!-- 巨龙血条 -->
<div id="bossBar" class="hidden">
  <div class="bossLabel">喷火龙</div>
  <div class="bossSegs">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<!-- 手机虚拟按键 -->
<div id="touchUI" class="hidden">
  <div class="moveWrap">
    <div class="tbtn" id="btnLeft"><div class="triL"></div></div>
    <div class="tbtn" id="btnRight"><div class="triR"></div></div>
  </div>
  <div class="rightWrap">
    <div class="tbtn" id="btnUltimate">G</div>
    <div class="rightBottom">
      <div class="tbtn" id="btnAttack">攻</div>
      <div class="tbtn" id="btnJump"><div class="triU"></div><span>跳</span></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   相遇之旅 —— 单文件 Canvas 横版平台跳跃小游戏
   无任何外部资源，音效由 Web Audio 实时合成
   ============================================================ */

/* ---------------- 基础与画布 ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  makeStars();
  vigGrad = null; skyKey = '';
}
window.addEventListener('resize', resize);

/* 视口缩放：世界坐标系固定，屏幕缩放自适应 */
let scale = 1;
function viewScale() { return clamp(Math.min(W / 880, H / 600), 0.75, 1.6); }

/* ---------------- 工具函数 ---------------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function ellipse(g, x, y, rx, ry) {
  g.beginPath();
  g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
}
function heartPath(g, s) {
  g.beginPath();
  g.moveTo(0, s * 0.9);
  g.bezierCurveTo(-s * 1.1, s * 0.12, -s * 0.72, -s * 0.72, 0, -s * 0.22);
  g.bezierCurveTo(s * 0.72, -s * 0.72, s * 1.1, s * 0.12, 0, s * 0.9);
  g.closePath();
}
function starPath(g, r) {

let AC = null, master = null;
function ensureAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = 0.28;
      master.connect(AC.destination);
    } catch (e) { /* 不支持则静音 */ }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (!AC || !master) return;
  type = type || 'sine'; vol = vol || 0.4; delay = delay || 0;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

let noiseBuf = null;
function noise(dur, vol, delay, freq) {
  if (!AC || !master) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 1), AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  const f = AC.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = freq || 800;
  const g = AC.createGain();
  const t0 = AC.currentTime + (delay || 0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + dur + 0.05);
}

/* ---------------- 背景星空（视差） ---------------- */
const starLayers = [];
function makeStars() {
  starLayers.length = 0;
  const mk = function (n, f, rmin, rmax, a) {
    const list = [];
    for (let i = 0; i < n; i++) {
      list.push({ x: Math.random() * 1040, y: Math.random() * (H + 80),
                  r: rmin + Math.random() * (rmax - rmin),
                  tw: Math.random() * 6, sp: 0.5 + Math.random() * 1.6, a: a });
    }
    return { f: f, list: list };
  };
  starLayers.push(mk(46, 0.15, 0.7, 1.6, 0.5));
  starLayers.push(mk(30, 0.35, 0.9, 2.1, 0.65));
  starLayers.push(mk(16, 0.6, 1.2, 2.6, 0.8));
}
function wrapV(v, span) { return ((v % span) + span) % span; }
function drawStars(t, camX, camY) {
  for (const layer of starLayers) {
    for (const s of layer.list) {
      const sx = wrapV(s.x - camX * layer.f, 1040) - 80;
      const sy = wrapV(s.y - camY * layer.f * 0.5, H + 80) - 40;
      const al = s.a * (0.72 + 0.28 * Math.sin(t * s.sp + s.tw));
      ctx.globalAlpha = al;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.r >= 2) { // 稍大的星星加十字微光
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(sx - s.r * 3, sy); ctx.lineTo(sx + s.r * 3, sy);
        ctx.moveTo(sx, sy - s.r * 3); ctx.lineTo(sx, sy + s.r * 3);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
}

  ctx.fillStyle = 'rgba(50,30,40,0.8)';

  ctx.moveTo(vx - 190 * scale, vy);
  ctx.lineTo(vx - 30 * scale, vy - 190 * scale);
  ctx.lineTo(vx + 20 * scale, vy - 130 * scale);
  ctx.lineTo(vx + 40 * scale, vy - 185 * scale);
  ctx.lineTo(vx + 160 * scale, vy);
  ctx.closePath();
  ctx.fill();
  const cg = ctx.createRadialGradient(vx + 5 * scale, vy - 160 * scale, 2, vx + 5 * scale, vy - 160 * scale, 70 * scale);
  cg.addColorStop(0, 'rgba(255,140,80,0.4)');
  cg.addColorStop(1, 'rgba(255,140,80,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(vx + 5 * scale, vy - 160 * scale, 70 * scale, 0, Math.PI * 2); ctx.fill();
  // 上升火星
  for (let i = 0; i < 18; i++) {
    const baseX = (i * 173) % 2000 + 80;
    const baseY = (i * 283) % 500;
    const mx = wrapV(baseX - cam.x * 0.5, 2100) - 150;
    const my = (yBase - 30) - wrapV(baseY + t * (28 + (i % 4) * 9), 620);
    const al = 0.25 + 0.25 * Math.sin(t * 1.8 + i * 1.4);
    ctx.globalAlpha = al;
    ctx.fillStyle = '#F2A86B';
    ctx.beginPath();
    ctx.arc(mx * scale + Math.sin(t * 0.7 + i) * 10, my * scale, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------------- 平台 / 草 / 花 ---------------- */
function drawPlatforms() {
  const wood = level.deco === 'forest';
  const vol = level.deco === 'volcano';
  for (const p of level.platforms) {
    const sx = (p.x - cam.x) * scale, sy = (p.y - cam.y) * scale;
    const w = p.w * scale, h = p.h * scale;
    if (sx + w < -40 || sx > W + 40) continue;
    const g = ctx.createLinearGradient(sx, sy, sx, sy + h);
    if (wood) { g.addColorStop(0, '#75593A'); g.addColorStop(1, '#503A24'); }
    else if (vol) { g.addColorStop(0, '#4A3B44'); g.addColorStop(1, '#33272E'); }
    else { g.addColorStop(0, '#453F74'); g.addColorStop(1, '#322C5E'); }
    ctx.fillStyle = g;
    rr(ctx, sx, sy, w, h, Math.min(7 * scale, h / 2));
    ctx.fill();
    ctx.fillStyle = vol ? 'rgba(230,150,90,0.45)' : (wood ? 'rgba(150,190,110,0.55)' : 'rgba(140,132,214,0.5)');

function bush(x, y) {

function drawGrass() {

function flower(x, y, col) {

function drawFlowers() {

/* ---------------- 星光收集物 ---------------- */
function starBobY(s, t) { return Math.sin(t * 2.4 + s.x * 0.02) * 4; }

/* ---------------- 乌云小怪 ---------------- */
function updateEnemies(dt) {
  for (const e of level.enemies) {
    if (e.type === 'lizard') updateLizard(e, dt);
    else if (e.type === 'beast') updateBeast(e, dt);
    else {
      e.x += e.dir * e.speed * dt;
      if (e.x <= e.x0) { e.x = e.x0; e.dir = 1; }
      if (e.x >= e.x1) { e.x = e.x1; e.dir = -1; }
    }
    e.flashT = Math.max(0, e.flashT - dt);
  }
}
function updateBeast(e, dt) {
  const pcx = player.x + player.w / 2;
  const near = Math.abs(pcx - e.x) < 110 && Math.abs((player.y - 20) - (e.y + 6)) < 85;
  // 只有空闲/冷却时才巡逻
  if (e.atkState === 'idle' || e.atkState === 'cooldown') {
    e.x += e.dir * e.speed * dt;
    if (e.x <= e.x0) { e.x = e.x0; e.dir = 1; }
    if (e.x >= e.x1) { e.x = e.x1; e.dir = -1; }
  }
  switch (e.atkState) {
    case 'idle':
      if (near) { e.atkState = 'windup'; e.atkT = 0; e.atkDir = pcx >= e.x ? 1 : -1; }
      break;
    case 'windup':
      e.atkT += dt;
      if (e.atkT >= 0.3) { e.atkState = 'swipe'; e.atkT = 0; sndSlash(); }
      break;
    case 'swipe':
      e.atkT += dt;
      if (e.atkT >= 0.18) { e.atkState = 'cooldown'; e.atkT = 0; }
      break;
    case 'cooldown':
      e.atkT += dt;
      if (e.atkT >= 1.1) { e.atkState = 'idle'; e.atkT = 0; }
      break;
  }
  // 抓挠命中判定（挥出的前半段有效）
  if (e.atkState === 'swipe' && e.atkT <= 0.14) {
    const tx = e.atkDir > 0 ? e.x + 18 : e.x + 18 - 72;
    if (rectOverlap(tx, e.y + 4, 72, 34, player.x + 3, player.y - 35, 24, 30)) onHurt(e.x);
  }
}
function updateLizard(e, dt) {
  const pcx = player.x + player.w / 2;
  const near = Math.abs(pcx - e.x) < 135 && Math.abs((player.y - 20) - (e.y + 6)) < 95;
  // 只有空闲/冷却时才巡逻
  if (e.atkState === 'idle' || e.atkState === 'cooldown') {
    e.x += e.dir * e.speed * dt;
    if (e.x <= e.x0) { e.x = e.x0; e.dir = 1; }
    if (e.x >= e.x1) { e.x = e.x1; e.dir = -1; }
  }
  switch (e.atkState) {
    case 'idle':
      if (near) { e.atkState = 'windup'; e.atkT = 0; e.atkDir = pcx >= e.x ? 1 : -1; }
      break;
    case 'windup':
      e.atkT += dt;
      if (e.atkT >= 0.35) { e.atkState = 'tongue'; e.atkT = 0; sndSlash(); }
      break;
    case 'tongue':
      e.atkT += dt;
      e.tongueLen = Math.min(1, e.atkT / 0.12) * 100;
      if (e.atkT >= 0.12) { e.atkState = 'hold'; e.atkT = 0; }
      break;
    case 'hold':
      e.atkT += dt;
      e.tongueLen = 100;
      if (e.atkT >= 0.1) { e.atkState = 'retract'; e.atkT = 0; }
      break;
    case 'retract':
      e.atkT += dt;
      e.tongueLen = Math.max(0, (1 - e.atkT / 0.12)) * 100;
      if (e.atkT >= 0.12) { e.atkState = 'cooldown'; e.atkT = 0; }
      break;
    case 'cooldown':
      e.atkT += dt;
      if (e.atkT >= 1.1) { e.atkState = 'idle'; e.atkT = 0; }
      break;
  }
  // 舌头命中判定
  if ((e.atkState === 'tongue' || e.atkState === 'hold') && e.tongueLen > 8) {
    const tx = e.atkDir > 0 ? e.x + 20 : e.x + 20 - e.tongueLen;
    if (rectOverlap(tx, e.y + 14, e.tongueLen, 9, player.x + 3, player.y - 35, 24, 30)) onHurt(e.x);
  }
}
function drawEnemy(e, t) {

function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);

  return dx * dx + dy * dy < r * r;
}

/* ---------------- 喷火龙 Boss ---------------- */
function makeBoss() {
  return {
    x: 3400, y: 390, hp: 5, maxHp: 5,
    state: 'circle', t: 0, active: false, dead: false,
    circleA: Math.PI * 0.5, cx: 3400, cy: 390,

function updateBoss(dt) {
  if (!boss || boss.dead) return;
  boss.t += dt;
  boss.flashT = Math.max(0, boss.flashT - dt);
  const pcx = player.x + player.w / 2;
  if (!boss.active) {
    // 玩家走到关卡最后一段时，巨龙现身
    if (pcx > 2900) {
      boss.active = true;
      sndRoar();
      sparkle(boss.x, boss.y, 22, '#F2A86B');
      updateBossBar();
    }
    return;
  }
  if (boss.state === 'dying') {
    // 坠落旋转
    boss.y += dt * 240;
    boss.x += dt * 40;
    boss.spin += dt * 7;
    if (boss.t >= 1.5) {
      boss.dead = true;
      sndBossDie();
      for (let k = 0; k < 30; k++) {
        const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 260;
        particles.push({ type: 'dot', x: boss.x, y: boss.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
                         life: 0, max: 0.6 + Math.random() * 0.6, size: 3 + Math.random() * 4, color: '#F2A86B' });
      }
      spawnHearts(boss.x, boss.y - 40, 12);
      flash = { r: 255, g: 150, b: 90, a: 0.35 };
      updateBossBar();
      startClearAt(boss.x, boss.y - 40);
    }
    return;
  }
  boss.diveCd -= dt;
  boss.fireCd -= dt;
  switch (boss.state) {
    case 'circle': {
      // 一直在天空盘旋
      boss.circleA += dt * 0.9;
      boss.x = boss.cx + Math.cos(boss.circleA) * 280;
      boss.y = boss.cy + Math.sin(boss.circleA) * 60;
      boss.dir = Math.sin(boss.circleA) >= 0 ? 1 : -1;
      if (boss.fireCd <= 0 && Math.abs(pcx - boss.x) < 700) {
        boss.fireCd = 8;
        boss.state = 'fireWindup';
        boss.t = 0;
        sndRoar();
      } else if (boss.diveCd <= 0 && Math.abs(pcx - boss.x) < 480 && pcx > 3000) {
        boss.diveCd = 3.2;
        boss.state = 'diveDown';
        boss.t = 0;
        boss.from = { x: boss.x, y: boss.y };
        boss.diveTarget = { x: pcx, y: player.y - 70 };
      }
      break;
    }
    case 'diveDown': {
      // 俯冲而下
      const k = Math.min(1, boss.t / 0.9);
      const e2 = k * k * (3 - 2 * k);
      boss.x = boss.from.x + (boss.diveTarget.x - boss.from.x) * e2;
      boss.y = boss.from.y + (boss.diveTarget.y - boss.from.y) * e2;
      boss.dir = boss.diveTarget.x >= boss.x ? 1 : -1;
      if (k >= 1) { boss.state = 'claw'; boss.t = 0; boss.clawActive = true; }
      break;
    }
    case 'claw': {
      // 爪子攻击
      if (boss.t >= 0.18) boss.clawActive = false;
      if (boss.t >= 0.4) {
        boss.state = 'diveUp';
        boss.t = 0;
        boss.from = { x: boss.x, y: boss.y };
        boss.diveTarget = { x: boss.cx + Math.cos(boss.circleA) * 280, y: boss.cy + Math.sin(boss.circleA) * 60 };
      }
      break;
    }
    case 'diveUp': {
      // 飞回天空
      const k = Math.min(1, boss.t / 1.0);
      const e2 = k * k * (3 - 2 * k);
      boss.x = boss.from.x + (boss.diveTarget.x - boss.from.x) * e2;
      boss.y = boss.from.y + (boss.diveTarget.y - boss.from.y) * e2;
      boss.dir = boss.diveTarget.x >= boss.x ? 1 : -1;
      if (k >= 1) { boss.state = 'circle'; boss.t = 0; }
      break;
    }
    case 'fireWindup': {
      // 飞到固定高位蓄力
      boss.x += (boss.fireX - boss.x) * Math.min(1, dt * 3);
      boss.y += (380 - boss.y) * Math.min(1, dt * 3);
      boss.dir = boss.fireX >= boss.x ? 1 : -1;
      if (boss.t >= 1.0) {
        boss.state = 'fire';
        boss.t = 0;
        boss.fireX2 = boss.x - 250;
        sndFire();
      }
      break;
    }
    case 'fire': {
      // 从天空喷出火焰，地面形成火焰区
      boss.dir = 1;
      for (let k = 0; k < 3; k++) {
        particles.push({ type: 'dot', x: boss.fireX2 + Math.random() * 500, y: 620 + Math.random() * 80,
                         vx: (Math.random() - 0.5) * 70, vy: -120 - Math.random() * 180,
                         life: 0, max: 0.45 + Math.random() * 0.4, size: 3 + Math.random() * 3.5, color: '#F2A86B' });
      }
      if (boss.t >= 1.2) { boss.state = 'circle'; boss.t = 0; }
      break;
    }
  }
  // 爪击命中

  // 火焰柱：多层火舌从龙嘴向下喷出，呈扇形扩散
  for (let i = 0; i < 7; i++) {
    const kk = i / 6;
    const cx = mx + (gmid - mx) * kk;
    const cy = my + (gy - my) * kk;
    const w = (7 + kk * 22) * scale;
    const h = (16 + kk * 46) * scale;
    ctx.fillStyle = 'rgba(214,86,44,0.85)';
    flameTongue(ctx, cx + (i % 2 ? 6 : -6) * scale, cy, h, w * 1.35, i + 11, t, -1);
    ctx.fillStyle = 'rgba(242,138,60,0.92)';
    flameTongue(ctx, cx, cy, h * 0.72, w * 0.9, i + 23, t, -1);
    ctx.fillStyle = 'rgba(255,216,138,0.95)';
    flameTongue(ctx, cx, cy, h * 0.4, w * 0.45, i + 37, t, -1);
  }
  // 地面翻滚火海
  for (let i = 0; i < 12; i++) {
    const fx = gx1 + (i + 0.5) * (gx2 - gx1) / 12;
    const w = (9 + (i % 3) * 3) * scale;
    const h = (26 + (i * 7) % 30) * scale;
    ctx.fillStyle = 'rgba(230,110,50,0.9)';
    flameTongue(ctx, fx, gy, h, w * 1.6, i + 51, t);
    ctx.fillStyle = 'rgba(242,150,70,0.95)';
    flameTongue(ctx, fx, gy, h * 0.66, w, i + 67, t);
    ctx.fillStyle = 'rgba(255,224,150,0.95)';
    flameTongue(ctx, fx, gy, h * 0.34, w * 0.5, i + 83, t);
  }
}

function drawCharacter(g, t, o) {
  // 局部坐标：脚底为原点；o = { girl, moving, onGround, face, squash, blink }
  const skin  = o.girl ? '#F5B6CC' : '#7FA9DD';

  const cloth = o.girl ? '#F2A6C2' : '#7B94D6';

  if (o.squash > 0) {
    const k = Math.sin(Math.min(o.squash, 0.14) / 0.14 * Math.PI);
    sys = 1 - 0.18 * k; sxs = 1 + 0.14 * k;
  }
  g.save();
  g.scale(o.face, 1);

    rr(g, 1 - swing * 5, -9, 8, 9, 3); g.fill();

    rr(g, 1, -9, 8, 9, 3); g.fill();

  if (!o.girl) {

      ang = u < 0.25 ? -2.75 : -2.75 + (u - 0.25) / 0.75 * 3.35;
    } else if (o.slash > 0) {
      ang = -2.4 + Math.min(o.slash, 1) * 2.9;
    } else {
      ang = -0.9;
    }
    g.save();
    g.translate(13, -19 - armSwing);
    g.rotate(ang);
    drawSword(g);
    g.restore();
  }
  // 脑袋
  g.fillStyle = skin;
  g.beginPath(); g.arc(0, -38, 14, 0, Math.PI * 2); g.fill();
  // 头发
  g.fillStyle = hair;
  if (o.girl) {
    // 发帽：覆盖头顶，发际线停在眼睛上方
    g.beginPath();
    g.arc(0, -38, 14.6, Math.PI * 1.08, Math.PI * 1.92);
    g.fill();
    // 刘海：三瓣圆弧，中间一瓣略长，轻轻垂在额前
    g.beginPath();
    g.arc(-5.8, -42.2, 4.2, 0, Math.PI * 2);
    g.arc(0, -42.2, 4.7, 0, Math.PI * 2);
    g.arc(5.8, -42.2, 4.2, 0, Math.PI * 2);
    g.fill();
    // 两侧垂发，柔柔地框住脸蛋
    rr(g, -16.8, -47, 6.4, 19, 3.2); g.fill();
    rr(g, 10.4, -47, 6.4, 19, 3.2); g.fill();
  } else {
    g.beginPath(); g.arc(0, -38, 14, Math.PI, Math.PI * 2); g.fill();
    // 呆毛
    g.strokeStyle = hair;
    g.lineWidth = 2.4;
    g.lineCap = 'round';
    g.beginPath(); g.moveTo(2, -51); g.quadraticCurveTo(7, -58, 12, -57); g.stroke();
  }
  // 蝴蝶结（女孩，头顶两侧）
  if (o.girl) {

      g.beginPath(); g.moveTo(0, 0); g.lineTo(-7, -5); g.lineTo(-7, 5); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(0, 0); g.lineTo(7, -5); g.lineTo(7, 5); g.closePath(); g.fill();
      g.beginPath(); g.arc(0, 0, 2.6, 0, Math.PI * 2); g.fill();
      g.restore();

  }
  // 表情
  if (o.blink) {

    g.beginPath(); g.moveTo(3, -38); g.lineTo(7.4, -38); g.stroke();
  } else {

    g.beginPath(); g.arc(5.2, -38, 2.5, 0, Math.PI * 2); g.fill();

  }
  // 微笑
  g.strokeStyle = ink; g.lineWidth = 2.2; g.lineCap = 'round';
  g.beginPath(); g.arc(0, -33.4, 4.8, Math.PI * 0.15, Math.PI * 0.85); g.stroke();
  // 腮红
  g.fillStyle = 'rgba(248,166,184,0.5)';
  ellipse(g, -8.4, -33, 3.4, 2.3); g.fill();
  ellipse(g, 8.4, -33, 3.4, 2.3); g.fill();
  // 高光
  g.strokeStyle = 'rgba(255,255,255,0.35)';
  g.lineWidth = 2;
  g.beginPath(); g.arc(0, -38, 11.6, Math.PI * 1.18, Math.PI * 1.5); g.stroke();
  g.restore();
}

/* ---------------- 粒子 ---------------- */
function sparkle(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 140;
    particles.push({ type: 'dot', x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                     life: 0, max: 0.5 + Math.random() * 0.4, size: 1.6 + Math.random() * 2.4, color: color });
  }
}
function spawnHearts(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ type: 'heart', x: x + (Math.random() - 0.5) * 60, y: y + (Math.random() - 0.5) * 40,
                     vx: (Math.random() - 0.5) * 50, vy: -60 - Math.random() * 90,
                     life: 0, max: 1.1 + Math.random() * 0.6, size: 4 + Math.random() * 4.5,
                     color: Math.random() < 0.5 ? '#F2A7C3' : '#B9C6F2' });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.max) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.97;
    if (p.type === 'dot') p.vy *= 0.96;
    else p.vy -= 12 * dt;
  }
}
function drawParticles() {
  for (const p of particles) {
    const k = 1 - p.life / p.max;
    const sx = (p.x - cam.x) * scale, sy = (p.y - cam.y) * scale;
    if (p.type === 'dot') {
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(sx, sy, p.size * scale, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha = k * 0.9;
      ctx.fillStyle = p.color;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.scale(scale, scale);
      heartPath(ctx, p.size);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------------- 玩家物理 ---------------- */
function updatePlayer(dt) {
  const accel = player.onGround ? 2600 : 1700;
  const maxV = 330;
  if (input.left && !input.right) player.vx -= accel * dt;
  else if (input.right && !input.left) player.vx += accel * dt;
  else {
    const f = (player.onGround ? 2400 : 500) * dt;
    if (Math.abs(player.vx) <= f) player.vx = 0;
    else player.vx -= Math.sign(player.vx) * f;
  }
  player.vx = clamp(player.vx, -maxV, maxV);
  if (input.left) player.face = -1;
  else if (input.right) player.face = 1;
  player.vy = Math.min(player.vy + GRAV * dt, 980);
  player.coyote = player.onGround ? COYOTE : player.coyote - dt;
  player.jumpBuf -= dt;
  if (player.jumpBuf > 0 && player.coyote > 0) {
    player.vy = -JUMP_V;
    player.onGround = false;
    player.coyote = 0;
    player.jumpBuf = 0;
    sndJump();
    sparkle(player.x + player.w / 2, player.y, 5, '#B9C6F2');
  }
  // 水平移动（平台为单向：侧面可穿过，不做水平阻挡）
  player.x += player.vx * dt;
  // 竖直移动 + 单向平台落地判定
  const prevBottom = player.y;
  player.y += player.vy * dt;
  player.onGround = false;
  for (const p of level.platforms) {
    if (rectOverlap(player.x, player.y - player.h, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vy >= 0 && prevBottom <= p.y + 16) {
        player.y = p.y;
        player.vy = 0;
        player.onGround = true;
        if (!player.wasGround) player.squashT = 0.14;
      }
    }
  }
  player.wasGround = player.onGround;
  if (player.x < -30) { player.x = -30; player.vx = 0; }
  if (player.x > level.w + 30 - player.w) { player.x = level.w + 30 - player.w; player.vx = 0; }
  player.squashT = Math.max(0, player.squashT - dt);
  player.atkCd = Math.max(0, player.atkCd - dt);
  player.slashT = Math.max(0, player.slashT - dt);
  player.ultT = Math.max(0, player.ultT - dt);
  player.invT = Math.max(0, player.invT - dt);
}
function pressJump() { if (screen === 'play') player.jumpBuf = JUMP_BUF; }
function releaseJump() { if (screen === 'play' && player.vy < -220) player.vy = -220; }

function buildLevel(i) {
  const def = LEVELS[i];
  curLevel = i;
  level = {
    name: def.name, w: def.w, deathY: def.deathY, camTop: def.camTop, camBottom: def.camBottom,
    groundY: def.groundY, sky: def.sky, moon: def.moon, deco: def.deco, arch: def.arch,
    flowers: def.flowers || [],
    platforms: def.platforms.map(function (p) { return { x: p.x, y: p.y, w: p.w, h: p.h }; }),
    stars: def.stars.map(function (s) { return { x: s.x, y: s.y, taken: false }; }),
    enemies: def.enemies.map(function (e) {
      return { x0: e.x0, x1: e.x1, y: e.y, baseY: e.y + 46, speed: 75, dir: 1, x: e.x0,
               phase: Math.random() * 6, hp: 2, flashT: 0, dead: false,
               type: def.enemy || 'cloud',
               atkState: 'idle', atkT: 0, atkDir: 1, tongueLen: 0 };
    }),
  };
  resetLevel();
}
function resetLevel() {
  const sp = LEVELS[curLevel].spawn;
  player.x = sp.x; player.y = sp.y;
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.wasGround = false;
  player.face = 1; player.squashT = 0;
  player.coyote = 0; player.jumpBuf = 0;
  for (const s of level.stars) s.taken = false;
  for (const e of level.enemies) { e.x = e.x0; e.dir = 1; e.hp = 2; e.flashT = 0; e.dead = false; }
  score = 0;
  particles.length = 0;
  slashes.length = 0;
  projectiles.length = 0;
  shockwaves.length = 0;
  energyT = 0;
  energyReady = false;
  flash = null;
  hp = 3;
  player.atkCd = 0;
  player.slashT = 0;
  player.ultT = 0;
  player.invT = 0;
  if (LEVELS[curLevel].boss) boss = makeBoss();
  else boss = null;
  updateBossBar();
  updateHUD();
  updateEnergyUI();
  snapCam();
  screen = 'play';
  syncUI();
}

    const s = localStorage.getItem('xyzl_cleared');
    if (s) {
      for (let i = 0; i < 3; i++) clearedLevels[i] = s.charAt(i) === '1';
    }
  } catch (e) { /* 无法读取时保持默认 */ }
  refreshUnlocked();
}
function saveProgress() {
  try {
    localStorage.setItem('xyzl_cleared', clearedLevels.map(function (c) { return c ? '1' : '0'; }).join(''));
  } catch (e) { /* 无法保存时忽略 */ }
}
function initLevelPanel() {
  levelPanel.innerHTML = '';
  LEVELS.forEach(function (L, i) {
    const b = document.createElement('div');
    b.className = 'lvlBtn';
    b.innerHTML = '<span>第' + CN_NUM[i] + '关 · ' + L.name + '</span><span class="lvlState"></span>';
    b.addEventListener('click', function (e) { e.stopPropagation(); selectLevel(i); });
    levelPanel.appendChild(b);
  });
}
function updateLevelPanel() {
  const btns = levelPanel.querySelectorAll('.lvlBtn');
  for (let i = 0; i < 3; i++) {
    const b = btns[i], st = b.querySelector('.lvlState');
    const playable = i + 1 <= unlocked;
    b.classList.toggle('locked', !playable);
    b.classList.toggle('current', i === curLevel && playable);
    st.textContent = clearedLevels[i] ? '✓' : (playable ? '' : '未解锁');
  }
}
function selectLevel(i) {
  if (screen !== 'play') return;
  if (i + 1 > unlocked) { openPwd(i); return; }
  levelPanel.classList.add('hidden');
  if (i === curLevel) return;
  fadeTo(1, 4, function () {
    buildLevel(i);
    screen = 'intro';
    showIntro();
    syncUI();
    fadeTo(0, 4);
  });
}
let pwdTarget = -1;  // 等待密码解锁的关卡索引
function openPwd(i) {
  pwdTarget = i;
  pwdInput.value = '';
  pwdErr.classList.add('hidden');
  pwdModal.classList.remove('hidden');
  setTimeout(function () { pwdInput.focus(); }, 60);
}
function closePwd() {
  pwdModal.classList.add('hidden');
  pwdTarget = -1;
}
function confirmPwd() {
  if (pwdTarget < 0) return;
  if (pwdInput.value.trim() === '0000') {
    for (let k = 0; k <= pwdTarget; k++) clearedLevels[k] = true;
    refreshUnlocked();
    saveProgress();
    updateLevelPanel();
    updateLevelSelect();
    sndPick();
    closePwd();
  } else {
    pwdErr.classList.remove('hidden');
    const m = pwdModal.querySelector('.modal');
    m.classList.remove('pwdShake');
    void m.offsetWidth;
    m.classList.add('pwdShake');
    sndHit();
  }
}
function snapCam() {
  const vw = W / scale, vh = H / scale;
  const tx = clamp(player.x + player.w / 2 - vw / 2, 0, Math.max(0, level.w - vw));
  let ty = player.y - player.h / 2 - vh * 0.55;
  ty = clamp(ty, level.camTop, Math.max(level.camTop, level.camBottom - vh));
  if (level.camBottom - level.camTop < vh) ty = level.camTop - (vh - (level.camBottom - level.camTop)) / 2;
  cam.x = tx; cam.y = ty;
}
function updateCam(dt) {
  if (!level) return;
  const vw = W / scale, vh = H / scale;
  const tx = clamp(player.x + player.w / 2 - vw / 2, 0, Math.max(0, level.w - vw));
  let ty = player.y - player.h / 2 - vh * 0.55;
  ty = clamp(ty, level.camTop, Math.max(level.camTop, level.camBottom - vh));
  if (level.camBottom - level.camTop < vh) ty = level.camTop - (vh - (level.camBottom - level.camTop)) / 2;
  const k = Math.min(1, dt * 6);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
}
function onDeath() {
  if (screen !== 'play') return;
  screen = 'dead';
  syncUI();
  sndHit();
  shakeT = SHAKE_DUR;
  sparkle(player.x + player.w / 2, player.y - 20, 12, '#8E86C8');
  input.left = input.right = false;
  fadeTo(1, 4.5, function () { resetLevel(); fadeTo(0, 4); });
}
function hurtFeedback(fromX) {
  sndHit();
  player.invT = 1.2;
  player.vy = -380;
  player.vx = (player.x + player.w / 2 < fromX ? -260 : 260);
  player.onGround = false;
  flash = { r: 255, g: 120, b: 140, a: 0.22 };
  shakeT = Math.max(shakeT, 0.25);
  sparkle(player.x + player.w / 2, player.y - 20, 10, '#F06D86');
}
function onHurt(fromX) {
  if (screen !== 'play' || player.invT > 0) return;
  hp--;
  updateHUD();
  if (hp <= 0) { onDeath(); return; }
  hurtFeedback(fromX);
}
function onFireHit() {
  if (screen !== 'play' || player.invT > 0) return;
  hp -= 2; // 火焰直接扣两颗心
  updateHUD();
  if (hp <= 0) { onDeath(); return; }
  hurtFeedback(boss ? boss.x : player.x);
}
function startClearAt(x, y) {
  if (screen !== 'play') return;
  screen = 'clear';
  syncUI();
  clearT = 0;
  sndClear();
  spawnHearts(x, y, 14);
  sparkle(player.x + player.w / 2, player.y - 20, 16, '#F6BED3');
  player.vx = 0; player.vy = 0;
}
function checkInteractions(t) {
  for (const e of level.enemies) {
    if (e.dead) continue;
    if (rectOverlap(player.x + 3, player.y - 35, 24, 30, e.x - 20, e.y - 16, 40, 30)) { onHurt(e.x); return; }
  }
  for (const s of level.stars) {
    if (s.taken) continue;
    const by = starBobY(s, t);
    const dx = s.x - (player.x + player.w / 2);
    const dy = (s.y + by) - (player.y - 20);
    if (dx * dx + dy * dy < 31 * 31) {
      s.taken = true;
      score++;
      sndStar();
      sparkle(s.x, s.y + by, 10, '#FFE29A');
      updateHUD();
    }
  }
  const a = level.arch;
  if (a && rectOverlap(player.x, player.y - player.h, player.w, player.h, a.x - 48, a.y - 130, 96, 140)) startClearAt(a.x, a.y - 80);
  if (player.y > level.deathY) onDeath();
}

/* ---------------- 转场黑幕 ---------------- */
function fadeTo(target, speed, cb) {
  const startA = fade ? fade.a : (target >= 1 ? 0 : 1);
  if (startA === target) { if (cb) cb(); return; }
  fade = { a: startA, target: target, speed: speed, cb: cb || null };
}
function fadeStep(dt) {
  if (!fade) return;
  const dir = Math.sign(fade.target - fade.a);
  fade.a += dir * fade.speed * dt;
  if (dir === 0 || (dir > 0 ? fade.a >= fade.target : fade.a <= fade.target)) {
    fade.a = fade.target;
    if (fade.target >= 1) {
      if (fade.cb) { const cb2 = fade.cb; fade.cb = null; cb2(); return; }
      fade = null;
      return;
    }
    fade = null;
  }
}

/* ---------------- UI 交互 ---------------- */
const selectScreen = document.getElementById('selectScreen');
const homeScreen = document.getElementById('homeScreen');
const levelSelectScreen = document.getElementById('levelSelectScreen');
const levelCards = document.getElementById('levelCards');
let pendingLevel = 0;   // 主页「选择关卡」流程中记住的关卡
const introModal = document.getElementById('introModal');
const endingModal = document.getElementById('endingModal');
const hud = document.getElementById('hud');
const touchUI = document.getElementById('touchUI');
const energyWrap = document.getElementById('energyWrap');
const energyFill = document.getElementById('energyFill');
const energyLabel = document.getElementById('energyLabel');
const btnUltimateEl = document.getElementById('btnUltimate');
const levelSelBtn = document.getElementById('levelSelBtn');
const levelPanel = document.getElementById('levelPanel');
const pwdModal = document.getElementById('pwdModal');
const pwdInput = document.getElementById('pwdInput');
const pwdErr = document.getElementById('pwdErr');
const bossBar = document.getElementById('bossBar');
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function syncUI() {
  const inGame = screen === 'play' || screen === 'clear' || screen === 'dead';
  hud.classList.toggle('hidden', !inGame);
  energyWrap.classList.toggle('hidden', !inGame);
  touchUI.classList.toggle('hidden', !(isTouch && inGame));
  if (!inGame) levelPanel.classList.add('hidden');
  updateLevelPanel();
  updateBossBar();
}
function showHome() {
  homeScreen.classList.remove('hidden');
  selectScreen.classList.add('hidden');
  levelSelectScreen.classList.add('hidden');
}
function showSelect() {
  homeScreen.classList.add('hidden');
  levelSelectScreen.classList.add('hidden');
  selectScreen.classList.remove('hidden');
}
function showLevelSelect() {
  homeScreen.classList.add('hidden');
  selectScreen.classList.add('hidden');
  levelSelectScreen.classList.remove('hidden');
  updateLevelSelect();
}
function updateLevelSelect() {
  levelCards.innerHTML = '';
  LEVELS.forEach(function (L, i) {
    const playable = i + 1 <= unlocked;
    const b = document.createElement('div');
    b.className = 'levelCard' + (playable ? '' : ' locked');
    b.innerHTML = '<div class="lname">第' + CN_NUM[i] + '关 · ' + L.name + '</div>' +
      '<div class="lstate">' + (clearedLevels[i] ? '✓ 已通关' : (playable ? '可挑战' : '未解锁 · 点击输入密码')) + '</div>';
    b.addEventListener('click', function () {
      ensureAudio();
      sndPick();
      if (!playable) { openPwd(i); return; }
      pendingLevel = i;
      showSelect();
    });
    levelCards.appendChild(b);
  });
}
function showIntro() {
  document.getElementById('introTitle').textContent = '第' + CN_NUM[curLevel] + '关：' + LEVELS[curLevel].name;
  document.getElementById('introText').textContent = LEVELS[curLevel].text;
  introModal.classList.remove('hidden');
}
function advanceIntro() {
  if (screen !== 'intro') return;
  introModal.classList.add('hidden');
  if (document.activeElement) document.activeElement.blur();
  screen = 'play';
  syncUI();
  if (fade && fade.target > 0) fadeTo(0, 4);
}
function showEnding() {
  screen = 'ending';
  syncUI();
  endingModal.classList.remove('hidden');
  fadeTo(0, 4);
}
function restartGame() {
  if (screen !== 'ending') return;
  ensureAudio();
  sndPick();
  fadeTo(1, 5, function () {
    endingModal.classList.add('hidden');
    showHome();
    screen = 'select';
    syncUI();
    fadeTo(0, 4);
  });
}
function pickCharacter(g) {
  ensureAudio();
  sndPick();
  chosen = g;
  // 能量条颜色随角色变化：嘉嘉蓝紫，玮玮粉
  energyFill.style.background = chosen === 'boy'
    ? 'linear-gradient(90deg,#7FA9DD,#B9A9F0)'
    : 'linear-gradient(90deg,#F2A6C2,#F6BED3)';
  fadeTo(1, 5, function () {
    buildLevel(pendingLevel);
    screen = 'intro';
    selectScreen.classList.add('hidden');
    showIntro();
    syncUI();
    fadeTo(0, 4);
  });
}
document.getElementById('cardBoy').addEventListener('click', function () { pickCharacter('boy'); });
document.getElementById('cardGirl').addEventListener('click', function () { pickCharacter('girl'); });
document.getElementById('introBtn').addEventListener('click', function () { advanceIntro(); });
document.getElementById('restartBtn').addEventListener('click', function () { restartGame(); });
document.getElementById('startGameBtn').addEventListener('click', function () { ensureAudio(); sndPick(); pendingLevel = 0; showSelect(); });
document.getElementById('homeLevelBtn').addEventListener('click', function () { ensureAudio(); sndPick(); showLevelSelect(); });
document.getElementById('selectBackBtn').addEventListener('click', function () { ensureAudio(); sndPick(); showHome(); });
document.getElementById('levelBackBtn').addEventListener('click', function () { ensureAudio(); sndPick(); showHome(); });
levelSelBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  if (screen !== 'play') return;
  updateLevelPanel();
  levelPanel.classList.toggle('hidden');
});
initLevelPanel();
loadProgress();
document.getElementById('pwdOk').addEventListener('click', confirmPwd);
document.getElementById('pwdCancel').addEventListener('click', closePwd);
pwdInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); confirmPwd(); }
  if (e.key === 'Escape') { closePwd(); }
});

/* ---------------- 键盘 ---------------- */
window.addEventListener('keydown', function (e) {
  ensureAudio();
  if (!pwdModal.classList.contains('hidden')) return; // 密码弹窗打开时，游戏按键不响应
  const c = e.code;
  if (c === 'Enter' || (c === 'Space' && screen === 'intro')) {
    if (screen === 'intro') { e.preventDefault(); advanceIntro(); return; }
    if (screen === 'ending') { e.preventDefault(); restartGame(); return; }
    if (c === 'Enter') return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (c === 'ArrowLeft' || c === 'KeyA') { e.preventDefault(); input.left = true; }
  else if (c === 'ArrowRight' || c === 'KeyD') { e.preventDefault(); input.right = true; }
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') { e.preventDefault(); if (!e.repeat) pressJump(); }
  else if (c === 'KeyG') { e.preventDefault(); if (!e.repeat) tryUltimate(); }
});
window.addEventListener('keyup', function (e) {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') input.left = false;
  else if (c === 'ArrowRight' || c === 'KeyD') input.right = false;
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') releaseJump();
});
window.addEventListener('blur', function () { input.left = input.right = false; });
canvas.addEventListener('mousedown', function (e) {
  levelPanel.classList.add('hidden');
  if (e.button !== 0) return;
  ensureAudio();
  tryAttack();
});

/* ---------------- 触屏虚拟按键（支持多点） ---------------- */
function bindTouchBtn(id, onDown, onUp) {
  const el = document.getElementById(id);
  const ids = new Set();
  el.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    ids.add(e.pointerId);
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    onDown();
  });
  const end = function (e) {
    ids.delete(e.pointerId);
    if (ids.size === 0) onUp();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
}
bindTouchBtn('btnLeft', function () { input.left = true; }, function () { input.left = false; });
bindTouchBtn('btnRight', function () { input.right = true; }, function () { input.right = false; });
bindTouchBtn('btnJump', function () { pressJump(); }, function () { releaseJump(); });
bindTouchBtn('btnAttack', function () { tryAttack(); }, function () {});
bindTouchBtn('btnUltimate', function () { tryUltimate(); }, function () {});

/* ---------------- 禁滚动 / 禁缩放 ---------------- */
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------------- 主循环 ---------------- */
function update(dt, t) {
  fadeStep(dt);
  if (shakeT > 0) {
    shakeT -= dt;
    const k = shakeT / SHAKE_DUR;
    shx = (Math.random() * 2 - 1) * SHAKE_MAG * k;
    shy = (Math.random() * 2 - 1) * SHAKE_MAG * k;
  } else { shx = 0; shy = 0; }
  updateParticles(dt);
  updateShockwaves(dt);
  if (flash) {
    flash.a -= dt * 0.9;
    if (flash.a <= 0) flash = null;
  }
  if (screen === 'select') {
    updateMenuFx(dt);
  } else if (screen === 'play' && pwdModal.classList.contains('hidden')) {
    updatePlayer(dt);
    updateEnemies(dt);
    updateBoss(dt);
    updateSlashes(dt);
    updateProjectiles(dt);
    level.enemies = level.enemies.filter(function (e) { return !e.dead; });
    checkInteractions(t);
    // 大招蓄能
    const wasReady = energyReady;
    energyT = Math.min(energyT + dt, ENERGY_MAX);
    energyReady = energyT >= ENERGY_MAX;
    if (energyReady && !wasReady) sndEnergyReady();
    updateEnergyUI();
  } else if (screen === 'clear') {
    clearT += dt;
    if (clearT > 1.6) {
      clearT = 0;
      fadeTo(1, 4, function () {
        clearedLevels[curLevel] = true;
        refreshUnlocked();
        saveProgress();
        if (curLevel >= 2) showEnding();
        else {
          buildLevel(curLevel + 1);
          screen = 'intro';
          showIntro();
          syncUI();
          fadeTo(0, 4);
        }
      });
    }
  }
  updateCam(dt);
}
function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shx || shy) ctx.translate(shx, shy);
  if (screen === 'select') {
    drawMenu(t);
  } else if (level) {
    drawSky(level.sky[0], level.sky[1]);
    if (level.night) {
      drawMoonAt((level.moon.x - cam.x * 0.15) * scale, (level.moon.y - cam.y * 0.1) * scale, level.moon.tint);
      drawStars(t, cam.x, cam.y);
    } else {
      drawSun();
      drawLightBeams(t);
      drawMotes(t);
    }
    if (level.deco === 'forest') drawForest();
    else if (level.deco === 'volcano') drawVolcano(t);
    else if (level.deco === 'clouds') drawClouds();
    else drawHills();
    drawPlatforms();
    drawGrass();
    if (level.deco === 'garden') drawFlowers();
    drawArch(t);
    for (const s of level.stars) drawStar(s, t);
    for (const e of level.enemies) drawEnemy(e, t);
    drawBoss(t);
    drawBossFire(t);
    drawPlayer(t);
    drawSlashes();
    drawProjectiles(t);
    drawShockwaves();
    drawParticles();
  }
  ctx.restore();
  drawVignette();
  if (flash) {
    ctx.fillStyle = 'rgba(' + flash.r + ',' + flash.g + ',' + flash.b + ',' + flash.a.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (fade) {
    ctx.fillStyle = 'rgba(10,8,26,' + fade.a.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  const t = now / 1000;
  scale = viewScale();
  update(dt, t);
  render(t);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
